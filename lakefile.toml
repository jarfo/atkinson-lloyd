name = "atkinson-lloyd"
version = "1.0.0"
keywords = ["math"]
license = "Apache-2.0"
defaultTargets = ["AtkinsonLloyd"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.33.0-rc1"

[[lean_lib]]
name = "AtkinsonLloyd"
